# ----------------------------
# Basic Project Settings
# ----------------------------
sonar.sources=src
sonar.tests=src
sonar.inclusions=src/**/*.ts,src/**/*.tsx
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
sonar.sourceEncoding=UTF-8

# ----------------------------
# Exclude test files from analysis
# (We want sonar to analyze all production code)
# ----------------------------
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx


# ----------------------------
# Reference branch for new code comparison
# ----------------------------
sonar.newCode.referenceBranch=main
